[package]
name = "ghostline-quest-builder"
version = "0.1.0"
edition = "2024"
description = "Standalone native Cyberpunk 2077 quest authoring"

[features]
default = ["build-ui"]
build-ui = []

[[bin]]
name = "ghostline-quest-builder"
path = "src/main.rs"
required-features = ["build-ui"]

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
ghostline-red = { git = "https://github.com/ghostline77/ghostline-red.git", rev = "6a69b41516d56e8cbebb3eaee43d4317a163521e" }
jsonschema = { version = "0.60.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
debug = 1
